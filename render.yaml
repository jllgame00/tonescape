services:
  - type: web
    name: tonescape
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LASTFM_API_KEY
        sync: false
